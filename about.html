<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://use.typekit.net/goi4oll.css">
<link rel="stylesheet" href="https://use.typekit.net/ree1gni.css">
<title>Zijing Pei</title>


<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "waverly-cf", sans-serif;
  font-weight: 500;
  font-style: normal;
  background: #fff;
  color: #000;
}

/* ---------- Header ---------- */

.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 86px;
  background: white;
  z-index: 1000;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 36px;
}

.logo {
  font-size: 60px;
  font-weight: 900;
  letter-spacing: -1.5px;
  text-align: center;
  font-family: "zapfino-extra-lt-pro", sans-serif;
font-weight: 400;
font-style: normal;
}

.collection-trigger {
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  width: fit-content;
}

.collection-trigger:hover {
  color: #6FA8FF;
}

.icons {
  display: flex;
  align-items: center;  
  justify-content: flex-end;
  gap: 22px;
}

.icons a {
  color: black;
  text-decoration: none;
}

.icon svg {
  transition: 0.3s;
}

.icon:hover svg {
  fill: #6FA8FF;
}

/* ---------- Collection Dropdown ---------- */

.collection-menu {
  position: fixed;
  top: 86px;
  left: 0;
  width: 100%;
  height: 0;
  background: white;
  overflow: hidden;
  z-index: 999;
  transition: height 0.35s ease;
}

.collection-area:hover .collection-menu {
  height: 260px;
}

.collection-list {
  padding: 32px 52px;
  display: grid;
  grid-template-columns: 220px 220px;
  gap: 18px 18px;
}

.collection-list a {
  color: black;
  text-decoration: none;
  font-size: 15px;
}

.collection-list a:hover {
  color: #6FA8FF;
}


</style>
